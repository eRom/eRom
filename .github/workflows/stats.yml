name: Stats du profil

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rafraichir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Relever les chiffres GitHub
        env:
          GH_TOKEN: ${{ secrets.PROFILE_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secret PROFILE_PAT absent. Le GITHUB_TOKEN du runner ne voit que les depots publics : repos_total et contrib sortiraient faux."
            exit 1
          fi
          gh api graphql -f query='
          {
            user(login: "eRom") {
              pub: repositories(privacy: PUBLIC, ownerAffiliations: OWNER) { totalCount }
              tous: repositories(ownerAffiliations: OWNER) { totalCount }
              contributionsCollection { totalCommitContributions }
              repositoriesContributedTo(includeUserRepositories: true, contributionTypes: [COMMIT]) { totalCount }
            }
          }' --jq '.data.user | {
            repos_publics: .pub.totalCount,
            repos_total: .tous.totalCount,
            contrib: .repositoriesContributedTo.totalCount,
            commits_12m: .contributionsCollection.totalCommitContributions
          }' > stats.json.tmp
          cat stats.json.tmp

      - name: Refuser une regression aberrante
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          avant = json.loads(Path("stats.json").read_text(encoding="utf-8"))
          apres = json.loads(Path("stats.json.tmp").read_text(encoding="utf-8"))
          for cle, ancien in avant.items():
              neuf = apres.get(cle)
              if not isinstance(neuf, int) or neuf <= 0:
                  sys.exit("::error::%s : valeur inexploitable (%r)" % (cle, neuf))
              if neuf < ancien * 0.8:
                  sys.exit("::error::%s : chute de %d a %d, publication annulee" % (cle, ancien, neuf))
          Path("stats.json").write_text(Path("stats.json.tmp").read_text(encoding="utf-8"), encoding="utf-8")
          Path("stats.json.tmp").unlink()
          PY

      - name: Regenerer le SVG
        run: python3 generate.py

      - name: Publier si les chiffres ont bouge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json profile.svg
          if git diff --cached --quiet; then
            echo "aucun changement"
            exit 0
          fi
          git commit -m "chore: rafraîchit les stats du profil"
          git push
